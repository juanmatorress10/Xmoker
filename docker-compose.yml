
services:
  db:
    image: postgres:15
    container_name: xmoker-db
    environment:
      POSTGRES_DB: xmokerdb
      POSTGRES_USER: xmoker
      POSTGRES_PASSWORD: xmoker123
    ports:
      - "10070:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: xmoker-backend:1.0
    container_name: xmoker-backend
    ports:
      - "10071:9090"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/xmokerdb
      SPRING_DATASOURCE_USERNAME: xmoker
      SPRING_DATASOURCE_PASSWORD: xmoker123
    restart: always

  frontend:
    image: xmoker-frontend:1.0
    container_name: xmoker-frontend
    ports:
    - "10072:80"      # Para servir la web
    - "10071:9090" # Para servir la API
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
